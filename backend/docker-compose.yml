services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    ports: ["5432:5432"]
    volumes: ["sentinel-postgres:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"], interval: 5s, timeout: 5s, retries: 10 }
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/sentinelpassword
    ports: ["7474:7474", "7687:7687"]
    volumes: ["sentinel-neo4j:/data", "sentinel-neo4j-logs:/logs"]
    healthcheck: { test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"], interval: 10s, timeout: 5s, retries: 10 }
  backend:
    build: .
    env_file: .env
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
    volumes: ["sentinel-uploads:/app/uploads"]
volumes:
  sentinel-postgres:
  sentinel-neo4j:
  sentinel-neo4j-logs:
  sentinel-uploads:
